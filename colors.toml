# Solarized Dark for Omarchy
# Palette: https://ethanschoonover.com/solarized/
#
# Text pairs follow Schoonover's own reading pairs:
#   body text      base03:base0  (background:foreground)
#   highlighted    base02:base1  (selection:selection_foreground,
#                                 lighter_background:light_foreground)
# Muted/comment tier is base01. Accents are the canonical Solarized eight.

mode = "dark"

accent = "#268bd2"
selection = "#073642"
muted = "#586e75"

background = "#002b36"
dark_background = "#002028"
darker_background = "#00151b"
lighter_background = "#073642"

foreground = "#839496"
dark_foreground = "#657b83"
light_foreground = "#93a1a1"
bright_foreground = "#93a1a1"

red = "#dc322f"
yellow = "#b58900"
orange = "#cb4b16"
green = "#859900"
cyan = "#2aa198"
blue = "#268bd2"
magenta = "#d33682"
brown = "#6c71c4"

bright_red = "#dc322f"
bright_yellow = "#b58900"
bright_green = "#859900"
bright_cyan = "#2aa198"
bright_blue = "#268bd2"
bright_magenta = "#d33682"

hyprland_active_border = "#268bd2 #2aa198 45deg"
hyprland_inactive_border = "#073642"
